<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tu código para entrar</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #fbfaf7;
      color: #1c1b22;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #fbfaf7"
    >
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 440px"
          >
            <tr>
              <td style="padding-bottom: 28px">
                <img
                  src="https://onmymind.pages.dev/logos/png/mark-512.png"
                  width="48"
                  height="48"
                  alt="OnMyMind"
                  style="display: block; border: 0"
                />
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 24px;
                  font-weight: 800;
                  letter-spacing: -0.02em;
                  line-height: 1.2;
                  padding-bottom: 12px;
                "
              >
                Tu código para entrar
              </td>
            </tr>
            <tr>
              <td style="font-size: 16px; line-height: 1.55; color: #4a4856; padding-bottom: 24px">
                Escribe este código en OnMyMind, en «Revisa tu email»:
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 24px">
                <div
                  style="
                    display: inline-block;
                    padding: 16px 24px;
                    border-radius: 16px;
                    background: #ffffff;
                    border: 1.5px solid #e6e2da;
                    font-size: 34px;
                    font-weight: 800;
                    letter-spacing: 0.18em;
                    font-family: 'SF Mono', Menlo, Consolas, monospace;
                    color: #1c1b22;
                  "
                >
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 1.55; color: #4a4856; padding-bottom: 24px">
                Caduca en una hora y solo vale una vez. Si lo pierdes, pide otro desde la misma
                pantalla.
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 13px;
                  line-height: 1.5;
                  color: #6e6b7a;
                  border-top: 1px solid #e6e2da;
                  padding-top: 20px;
                "
              >
                Si no has sido tú, ignora este correo: sin el código no pasa nada.<br />OnMyMind ·
                Sácalo de la cabeza.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
