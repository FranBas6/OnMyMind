<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OnMyMind</title>
    <meta name="description" content="Sácalo de la cabeza" />

    <meta name="theme-color" content="#5A4BE6" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="/logos/png/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/logos/svg/omm-mark.svg" type="image/svg+xml" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OnMyMind" />
    <link rel="apple-touch-icon" href="/logos/png/apple-touch-icon-180.png" />

    <!--
      Aplica el tema guardado por next-themes (clave "theme") antes de pintar, para que no haya
      parpadeo al abrir la app. En una SPA el script que inyecta next-themes nunca se ejecuta.
    -->
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('theme') || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
